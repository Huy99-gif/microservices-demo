apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: product-service
          image: product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PRODUCT_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg2://product_svc:$(PRODUCT_DB_PASSWORD)@postgres:5432/products_db"
            - name: USER_SERVICE_URL
              value: "http://user-service:5001"
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - port: 5002
      targetPort: 5002
