# Dinh danh project tren SonarQube
sonar.projectKey=microservices-demo
sonar.projectName=Microservices Demo
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Ma nguon (Java: user-service, frontend; Python: product-service)
sonar.sources=user-service/src/main,frontend/src/main,product-service/app.py
sonar.tests=user-service/src/test,frontend/src/test,product-service/test_app.py

# Java can class da bien dich (tao ra o stage Test bang mvn test)
sonar.java.binaries=user-service/target/classes,frontend/target/classes
sonar.java.test.binaries=user-service/target/test-classes,frontend/target/test-classes

sonar.exclusions=**/target/**,**/__pycache__/**,**/.pytest_cache/**